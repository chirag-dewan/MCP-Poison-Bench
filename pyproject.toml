[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-poison-bench"
version = "0.1.0"
description = "Controlled research benchmark for MCP tool-poisoning attacks and defenses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chirag Dewan" }]
keywords = ["mcp", "security", "benchmark", "prompt-injection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
]

# Runtime deps for the importable harness (harness.runner + harness.clients).
# Bounded here so downstreams can resolve; the current pinned compatibility
# snapshot lives in requirements.lock.txt, while v1.0 preserves the original run.
dependencies = [
    "mcp>=1.28.1,<2",
    "anthropic>=0.105",
]

[project.optional-dependencies]
# Extra model vendors. clients.py imports these lazily, only when a matching
# model id is requested, so they are not required for the Anthropic path.
openai = ["openai>=2.38"]
google = ["google-genai>=0.3"]
test = [
    "openai>=2.38,<3",
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7,<8",
]

[project.urls]
Repository = "https://github.com/chirag-dewan/MCP-Poison-Bench"
Issues = "https://github.com/chirag-dewan/MCP-Poison-Bench/issues"

[tool.setuptools.packages.find]
# Ship every Python namespace used by the command modules. Tasks, configs, result
# artifacts, and shell drivers remain checkout-only: a wheel supports importing
# the code and inspecting CLI help, but a full benchmark run still needs the repo.
where = ["."]
include = ["harness*", "defense*", "fixtures*", "scorer*", "dataset*", "servers*"]
namespaces = true
