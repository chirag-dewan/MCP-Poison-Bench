name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade installer
        run: python -m pip install --upgrade pip

      - name: Install from package metadata
        if: matrix.python-version == '3.11'
        run: python -m pip install ".[test]"

      - name: Install pinned benchmark environment
        if: matrix.python-version == '3.14'
        run: python -m pip install -r requirements.txt ".[test]"

      - name: Verify dependency consistency
        run: |
          python -m pip check

      - name: Run tests with coverage (offline — no API key required)
        run: >-
          python -m pytest -q
          --cov=harness --cov=defense --cov=scorer --cov=fixtures --cov=dataset
          --cov-report=term-missing --cov-fail-under=65

      - name: Verify descriptor catalog is in sync
        if: matrix.python-version == '3.14'
        run: |
          python -m dataset.build_neutered_dataset
          git diff --exit-code dataset/poisoned_descriptors.json

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Smoke-test installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/mcp-poison-wheel"
          "$RUNNER_TEMP/mcp-poison-wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/mcp-poison-wheel/bin/python" -c "import harness.arms; import harness.runner"
          "$RUNNER_TEMP/mcp-poison-wheel/bin/python" -m harness.sweep --help >/dev/null
